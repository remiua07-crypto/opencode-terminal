name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "skin/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "skin/**"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cài build-tools + platform
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-terminal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Gắn APK vào Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk#opencode-terminal-$TAG.apk \
            --clobber
